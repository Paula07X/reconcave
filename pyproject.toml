[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reconcave"
version = "1.0.0"
description = "Subdomain, IP and asset recon: crawl + certificate-transparency discovery + DNS resolution in one tool."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Paula Emad" }]
keywords = ["security", "recon", "subdomain", "dns", "osint", "bug-bounty", "pentest"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "urllib3>=1.26",
]

[project.urls]
Homepage = "https://github.com/paula07x/reconcave"
Repository = "https://github.com/paula07x/reconcave"
Issues = "https://github.com/paula07x/reconcave/issues"
Changelog = "https://github.com/paula07x/reconcave/blob/main/CHANGELOG.md"

[project.optional-dependencies]
full = ["tldextract>=3.4", "dnspython>=2.3", "rich>=13.0", "pyfiglet>=1.0", "colorama>=0.4"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
reconcave = "reconcave.cli:main"

[tool.setuptools.packages.find]
include = ["reconcave*"]
